[package]
name = "brisk-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "brisk"
path = "src/main.rs"

[dependencies]
brisk-platform.workspace = true
brisk-keymap.workspace = true
brisk-text.workspace = true
brisk-project.workspace = true
brisk-syntax.workspace = true
brisk-terminal.workspace = true
brisk-git.workspace = true
brisk-search.workspace = true
brisk-db.workspace = true
brisk-run.workspace = true
brisk-lint.workspace = true
brisk-lsp.workspace = true
brisk-dap.workspace = true
brisk-vm.workspace = true
brisk-web.workspace = true
gpui = "0.2.2"
futures = "0.3"
serde_json = "1"
# Already in the binary through gpui (png, usvg): Local History revisions are gzipped.
flate2 = "1"

[build-dependencies]
embed-resource = "3"

[features]
# Smoke tests and screenshot helpers (docs/testing.md). Off in release builds.
smoke = []
