[package]
name = "brisk-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The operating-system specific parts of Brisk: processes, Python layouts, shells, files, folders, fonts and saved passwords"

[dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_Registry", "Win32_UI_Shell", "Win32_System_SystemInformation", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_LibraryLoader"] }
