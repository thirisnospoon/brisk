[workspace]
resolver = "2"
members = [
    "crates/brisk-platform",
    "crates/brisk-keymap",
    "crates/brisk-text",
    "crates/brisk-project",
    "crates/brisk-syntax",
    "crates/brisk-terminal",
    "crates/brisk-git",
    "crates/brisk-search",
    "crates/brisk-db",
    "crates/brisk-run",
    "crates/brisk-lint",
    "crates/brisk-lsp",
    "crates/brisk-dap",
    "crates/brisk-vm",
    "crates/brisk-web",
    "crates/brisk-app",
]
exclude = ["third_party"]

# xattr 0.2.3 (through GPUI's HTTP client and async-tar) reads libc::ENOATTR, which libc
# 0.2.191 no longer defines on Linux. third_party/xattr is that release with ENODATA there;
# it is not compiled on Windows.
[patch.crates-io]
xattr = { path = "third_party/xattr" }

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
brisk-platform = { path = "crates/brisk-platform" }
brisk-keymap = { path = "crates/brisk-keymap" }
brisk-text = { path = "crates/brisk-text" }
brisk-project = { path = "crates/brisk-project" }
brisk-syntax = { path = "crates/brisk-syntax" }
brisk-terminal = { path = "crates/brisk-terminal" }
brisk-git = { path = "crates/brisk-git" }
brisk-search = { path = "crates/brisk-search" }
brisk-db = { path = "crates/brisk-db" }
brisk-run = { path = "crates/brisk-run" }
brisk-lint = { path = "crates/brisk-lint" }
brisk-lsp = { path = "crates/brisk-lsp" }
brisk-dap = { path = "crates/brisk-dap" }
brisk-vm = { path = "crates/brisk-vm" }
brisk-web = { path = "crates/brisk-web" }

ropey = { version = "1.6", default-features = false, features = ["simd"] } # only LF breaks lines, as in tree-sitter/ruff/git
ignore = "0.4"
nucleo-matcher = "0.3"
tree-sitter = "0.25"
tree-sitter-python = "0.25"
streaming-iterator = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# The build that smokes run on (`--profile smoke --features smoke`, docs/testing.md): release
# optimizations without LTO and with parallel, incremental codegen, so a rebuild after a change
# takes about a minute instead of ten. Size and startup are measured on the real release build.
[profile.smoke]
inherits = "release"
lto = false
codegen-units = 256
incremental = true

[profile.dev.package."*"]
opt-level = 2

# Code that is not on a hot path (database drivers, TLS, HTTP, URL parsing, compression,
# image codecs, grammars of languages other than Python) is optimized for size: it keeps
# brisk.exe inside its budget.
[profile.release.package.libsqlite3-sys]
opt-level = "s"
[profile.release.package.zstd-sys]
opt-level = "s"
[profile.release.package.ring]
opt-level = "s"
[profile.release.package.rustls]
opt-level = "s"
[profile.release.package.mysql]
opt-level = "s"
[profile.release.package.mysql_common]
opt-level = "s"
[profile.release.package.postgres]
opt-level = "s"
[profile.release.package.tokio-postgres]
opt-level = "s"
[profile.release.package.postgres-protocol]
opt-level = "s"
[profile.release.package.tree-sitter-typescript]
opt-level = "s"
[profile.release.package.tree-sitter-bash]
opt-level = "s"
[profile.release.package.tree-sitter-md]
