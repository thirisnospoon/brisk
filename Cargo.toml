[workspace]
resolver = "2"
members = [
    "crates/brisk-proc",
    "crates/brisk-keymap",
    "crates/brisk-text",
    "crates/brisk-project",
    "crates/brisk-syntax",
    "crates/brisk-terminal",
    "crates/brisk-git",
    "crates/brisk-search",
    "crates/brisk-db",
    "crates/brisk-run",
    "crates/brisk-lint",
    "crates/brisk-lsp",
    "crates/brisk-dap",
    "crates/brisk-vm",
    "crates/brisk-web",
    "crates/brisk-app",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
brisk-proc = { path = "crates/brisk-proc" }
brisk-keymap = { path = "crates/brisk-keymap" }
brisk-text = { path = "crates/brisk-text" }
brisk-project = { path = "crates/brisk-project" }
brisk-syntax = { path = "crates/brisk-syntax" }
brisk-terminal = { path = "crates/brisk-terminal" }
brisk-git = { path = "crates/brisk-git" }
brisk-search = { path = "crates/brisk-search" }
brisk-db = { path = "crates/brisk-db" }
brisk-run = { path = "crates/brisk-run" }
brisk-lint = { path = "crates/brisk-lint" }
brisk-lsp = { path = "crates/brisk-lsp" }
brisk-dap = { path = "crates/brisk-dap" }
brisk-vm = { path = "crates/brisk-vm" }
brisk-web = { path = "crates/brisk-web" }

ropey = { version = "1.6", default-features = false, features = ["simd"] } # only LF breaks lines, as in tree-sitter/ruff/git
ignore = "0.4"
nucleo-matcher = "0.3"
tree-sitter = "0.25"
tree-sitter-python = "0.25"
streaming-iterator = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

# Code that is not on a hot path (database drivers, TLS, compression, image codecs, grammars of languages
# other than Python) is optimized for size: it keeps brisk.exe inside its budget.
[profile.release.package.libsqlite3-sys]
opt-level = "s"
[profile.release.package.zstd-sys]
opt-level = "s"
[profile.release.package.ring]
opt-level = "s"
[profile.release.package.rustls]
opt-level = "s"
[profile.release.package.mysql]
opt-level = "s"
[profile.release.package.mysql_common]
opt-level = "s"
[profile.release.package.postgres]
opt-level = "s"
[profile.release.package.tokio-postgres]
opt-level = "s"
[profile.release.package.postgres-protocol]
opt-level = "s"
[profile.release.package.tree-sitter-typescript]
opt-level = "s"
[profile.release.package.tree-sitter-bash]
opt-level = "s"
[profile.release.package.tree-sitter-md]
opt-level = "s"
[profile.release.package.tree-sitter-javascript]
opt-level = "s"
[profile.release.package.tree-sitter-html]
opt-level = "s"
[profile.release.package.tree-sitter-css]
opt-level = "s"
[profile.release.package.tree-sitter-yaml]
opt-level = "s"
[profile.release.package.tree-sitter-json]
opt-level = "s"
[profile.release.package.tree-sitter-toml-ng]
opt-level = "s"
[profile.release.package.tokio]
opt-level = "s"
[profile.release.package.brisk-db]
opt-level = "s"
[profile.release.package.image]
opt-level = "s"
[profile.release.package.exr]
opt-level = "s"
[profile.release.package.tiff]
opt-level = "s"
[profile.release.package.gif]
opt-level = "s"
[profile.release.package.image-webp]
opt-level = "s"
[profile.release.package.qoi]
opt-level = "s"
[profile.release.package.rav1e]
opt-level = "s"
[profile.release.package.ravif]
opt-level = "s"
[profile.release.package.zune-jpeg]
opt-level = "s"
